; --- CONFIGURACIÓN GENERAL COMÚN ---
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps = 
    adafruit/Adafruit BNO08x @ ^1.2.5
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    mikalhart/TinyGPSPlus @ ^1.0.3
    adafruit/Adafruit BME280 Library @ ^2.2.4
    vshymanskyy/TinyGSM @ ^0.11.7
    mikem/RadioHead @ ^1.120
    adafruit/Adafruit INA219 @ ^1.2.3
    adafruit/Adafruit GFX Library @ ^1.11.5   
    adafruit/Adafruit SH110X @ ^2.1.8
    claws/BH1750 @ ^1.3.0

; =========================================================================
; ENTORNO PARA EL RETO DE DSP (Puro IMU a 100Hz - Cero bloqueos)
; =========================================================================
[env:dsp_esp32_s3]
board = esp32-s3-devkitm-1
; Le dice a PlatformIO que compile main_dsp.cpp e IGNORE el main de telecom
build_src_filter = +<*> -<main_telecom.cpp>

; Versión por si tú quieres correr el código de DSP en tu placa Steren
[env:dsp_esp32_steren]
board = esp32dev
build_src_filter = +<*> -<main_telecom.cpp>


; =========================================================================
; ENTORNO PARA EL RETO DE TELECOMUNICACIONES (Integración de Sensores)
; =========================================================================
[env:telecom_esp32_s3]
board = esp32-s3-devkitm-1
; Le dice a PlatformIO que compile main_telecom.cpp e IGNORE el main de dsp
build_src_filter = +<*> -<main_dsp.cpp>

; Versión por si quieres probar el ultrasonico en tu placa Steren
[env:telecom_esp32_steren]
board = esp32dev
build_src_filter = +<*> -<main_dsp.cpp>

; =========================================================================
; ENTORNO PARA EL TRANSMISOR MAESTRO (XIAO ESP32-S3 Sense con Cámara)
; =========================================================================
[env:telecom_xiao_s3]
board = seeed_xiao_esp32s3
; Le dice a PlatformIO que compile main_telecom.cpp e IGNORE el main de dsp
build_src_filter = +<*> -<main_dsp.cpp>
; BANDERAS CRÍTICAS: Encienden la PSRAM interna para que la cámara funcione
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue